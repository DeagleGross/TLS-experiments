# Docker Compose for TLS Handshake Server (Async Multi-Threaded C Implementation)
# Run with: docker compose -f compose-csharp-demo.yml up --build

services:
  tls-server-demo-semiunmanaged-socket:
    build:
      context: ./src-dotnet/DemoSemiUnmanagedSocket
      dockerfile: Dockerfile
    container_name: csharp-tls-server-demo-semiunmanaged-socket
    ports:
      - "5007:5007"
    cpuset: "0-3"
    volumes:
      - ./certs:/app/certs:ro
    environment:
      # Certificate curve: p256 (fastest), p384 (default, heaviest)
      - CURVE=${CURVE:-p384}
      - PORT=5007
      - WORKERS=4
    restart: unless-stopped
