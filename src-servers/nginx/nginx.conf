# NGINX configuration for TLS performance testing
# Optimized for TLS handshake benchmarking

worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 10240;
    use epoll;
    multi_accept on;
}

http {
    # Disable access log for performance
    access_log off;
    error_log /var/log/nginx/error.log warn;

    # TCP optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # Keep-alive settings (can be disabled via client for handshake testing)
    keepalive_timeout 65;
    keepalive_requests 100;

    # TLS server on port 8443 (same as other test servers)
    server {
        listen 8443 ssl reuseport;
        server_name localhost;

        # Certificate paths (mounted from certs directory)
        # Use p256 or p384 based on CURVE environment variable
        ssl_certificate /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        # TLS configuration
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        
        # TLS 1.3 ciphers (prioritized)
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384;

        # Session caching (important for TLS performance)
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets on;

        # ECDH curve configuration
        ssl_ecdh_curve X25519:secp384r1:secp256r1;

        # Simple response for benchmarking
        location / {
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }

        # Health check endpoint
        location /health {
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}
