# Docker Compose for TLS Handshake Server (Async Multi-Threaded C Implementation)
# Run with: docker compose -f compose-ssl-async-mt.yml up --build

services:
  tls-server-workers:
    build:
      context: ./src-dotnet/AsyncTlsSockets
      dockerfile: Dockerfile
    container_name: csharp-tls-server-workers
    ports:
      - "5008:5008"
    cpuset: "0-3"
    volumes:
      - ./certs:/app/certs:ro
    environment:
      # Certificate curve: p256 (fastest), p384 (default, heaviest)
      - CURVE=${CURVE:-p384}
      - PORT=5008
      - WORKERS=16
    restart: unless-stopped
