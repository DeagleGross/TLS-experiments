# Docker Compose for TLS Handshake Server (Async Multi-Threaded C Implementation)
# Run with: docker compose -f compose-ssl-async-mt.yml up --build

services:
  tls-server-workers:
    build:
      context: ./src-dotnet/AsyncTlsSockets
      dockerfile: Dockerfile
    container_name: csharp-tls-server-workers
    ports:
      - "5008:5008"
    cpuset: "0-3"
    volumes:
      - ./certs:/app/certs:ro
    # Override command if needed:
    # command: ["5008", "certs/server-p384.crt", "certs/server-p384.key"]
    restart: unless-stopped
