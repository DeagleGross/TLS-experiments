services:
  csharp-tls-server-bio-epollworkers:
    container_name: csharp-tls-server-bio-epollworkers
    build:
      # Build context is THIS experiment's folder so the Dockerfile can see
      # src/ AND we never depend on src-dotnet/DemoSemiUnmanagedSocket.
      context: .
      dockerfile: Dockerfile
    ports:
      - "5008:5008"
    volumes:
      # Mount the shared certs from the repo root.
      - ../../certs:/app/certs:ro
    environment:
      CURVE: p384
      PORT: "5008"
      WORKERS: "4"
    # Fairness controls — match other proof experiments.
    cpuset: "0-3"
    cpus: 4
    mem_limit: 2g
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    restart: "no"
